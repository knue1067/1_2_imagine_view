<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여기저기에서 본다면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCEFFA; --ink:#1E2B4D; --paper:#FFFFFF; --soft:#EEF6FC;
  --sun:#FFC83D; --berry:#EF4E6C; --leaf:#1F9E6A; --pool:#2F7FD1;
  --line:rgba(30,43,77,.14); --lift:0 .3rem 0 rgba(30,43,77,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14213B; --ink:#EAF2FF; --paper:#22335A; --soft:#1B2A4A; --line:rgba(234,242,255,.16); --lift:0 .3rem 0 rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ --bg:#14213B; --ink:#EAF2FF; --paper:#22335A; --soft:#1B2A4A; --line:rgba(234,242,255,.16); --lift:0 .3rem 0 rgba(0,0,0,.35); }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:clamp(13px,1.05vw,40px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;word-break:keep-all;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:.3rem solid var(--pool);outline-offset:.2rem}
#app{height:100%}

/* ---------- 처음 화면 ---------- */
.home{display:none;height:100%;position:relative;overflow:hidden}
.home.on{display:grid;grid-template-columns:1fr 1.1fr;grid-template-rows:minmax(0,1fr) auto auto;gap:1.6rem 2rem;padding:2.4rem 3.2rem 1.8rem}
.hero-text{align-self:center;padding-left:.4rem}
.tag{display:inline-block;background:var(--paper);border-radius:999px;padding:.45rem 1.1rem;font-size:1.25rem;box-shadow:var(--lift)}
h1{font-weight:400;font-size:6.6rem;line-height:1.04;margin:1.2rem 0 1.1rem;letter-spacing:-.02em}
h1 .w{display:inline-block}
h1 .w:nth-child(1){transform:translateY(-.08em) rotate(-4deg)}
h1 .w:nth-child(2){transform:translateY(.06em) rotate(3deg)}
h1 .w:nth-child(3){transform:translateY(-.04em) rotate(-2deg)}
h1 .w:nth-child(4){transform:translateY(.08em) rotate(4deg)}
.goal{font-size:1.9rem;line-height:1.45;margin:0;max-width:24em;opacity:.85}
.hero-art{width:100%;height:100%;min-height:0}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-14px,10px)}to{transform:translate(14px,-10px)}}
.acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.act{min-width:0;border:0;border-radius:2rem;padding:1.4rem 1.6rem 1.5rem;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:1.2rem;align-items:center;box-shadow:0 .45rem 0 rgba(30,43,77,.2);transition:transform .15s}
.act:hover{transform:translateY(-.25rem)}
.act:active{transform:translateY(.15rem)}
.act svg{grid-row:1/3;width:7.2rem;height:7.2rem}
.act b{font-weight:400;font-size:2.05rem;display:flex;align-items:center;gap:.6rem}
.act .n{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.9);color:#1E2B4D;font-size:1.5rem}
.act small{font-size:1.3rem;line-height:1.4;opacity:.92;margin-top:.35rem}
.a1{background:#FFC83D;color:#1E2B4D}
.a2{background:#2F7FD1;color:#fff}
.a3{background:#1F9E6A;color:#fff}
.keys{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.5rem 1.4rem;font-size:1.1rem;opacity:.75;justify-content:center}
kbd{font-family:inherit;background:var(--paper);border-radius:.4rem;padding:.05rem .5rem;box-shadow:0 .15rem 0 var(--line);margin-right:.25rem}

/* ---------- 활동 화면 ---------- */
.screen{display:none;height:100%;grid-template-rows:auto minmax(0,1fr) auto;gap:1rem;padding:1.1rem 1.5rem 1.2rem}
.screen.on{display:grid}
.bar{display:flex;align-items:center;gap:1rem}
.pill{border:0;background:var(--paper);border-radius:999px;padding:.7rem 1.3rem;font-size:1.35rem;box-shadow:var(--lift);display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
.q{flex:1;margin:0;display:flex;align-items:center;gap:1rem;font-size:2.15rem;line-height:1.3;background:var(--paper);border-radius:1.4rem;padding:.65rem 1.4rem;box-shadow:var(--lift);min-height:4.2rem}
.q i{font-style:normal;flex:none;display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--sun);color:#1E2B4D;font-size:1.7rem}
.mid{display:grid;grid-template-columns:minmax(12rem,auto) minmax(0,1fr);gap:1.1rem;min-height:0}
.mid.three{grid-template-columns:minmax(12rem,auto) minmax(0,1fr) minmax(12rem,auto)}
.side{display:flex;flex-direction:column;gap:.65rem;justify-content:center;overflow:auto;padding:.3rem .2rem .6rem}
.stage{position:relative;min-height:0;height:100%;border-radius:1.8rem;overflow:hidden;background:#cfdbe6;box-shadow:inset 0 0 0 .25rem var(--line)}
.stage canvas,.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.badge{position:absolute;top:1rem;left:1rem;z-index:2;background:rgba(255,255,255,.94);color:#1E2B4D;border-radius:999px;padding:.5rem 1.2rem;font-size:1.6rem;box-shadow:0 .25rem 0 rgba(30,43,77,.15);pointer-events:none}
.hint{position:absolute;top:1rem;right:1rem;z-index:2;background:rgba(255,255,255,.78);color:#1E2B4D;border-radius:999px;padding:.4rem 1rem;font-size:1.1rem;pointer-events:none}
.say{position:absolute;left:50%;bottom:1.3rem;z-index:3;transform:translate(-50%,0);max-width:min(82%,46em);background:#fff;color:#1E2B4D;border:.25rem solid #1E2B4D;border-radius:1.5rem;padding:.9rem 1.5rem 1rem;font-size:2.05rem;line-height:1.38;box-shadow:0 .4rem 0 rgba(30,43,77,.25);transition:opacity .25s,transform .25s}
.say small{display:block;font-size:1.15rem;opacity:.6;margin-bottom:.15rem}
.say.off{opacity:0;transform:translate(-50%,1rem);pointer-events:none}
.ctrl{display:flex;gap:.8rem;justify-content:center;align-items:stretch;flex-wrap:wrap}
.chip{border:.22rem solid transparent;background:var(--paper);border-radius:999px;padding:.7rem 1.35rem;font-size:1.6rem;box-shadow:var(--lift);display:inline-flex;align-items:center;gap:.55rem;transition:background .15s,color .15s,transform .1s}
.chip:active{transform:translateY(.15rem)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.big{font-size:1.75rem;padding:.85rem 1.5rem}
.chip.accent{background:var(--sun);color:#1E2B4D}
.chip.accent.on{background:#1E2B4D;color:#FFC83D}
.chip.dice{background:var(--berry);color:#fff}
.chip .e{font-size:1.15em;line-height:1}
.chip svg{width:1.9em;height:1.9em;flex:none}
.side .chip{width:100%;justify-content:flex-start;border-radius:1.2rem}
.side .chip.pose{padding:.35rem 1rem .35rem .5rem}
.side .chip.pose svg{width:3.4rem;height:3.4rem}
.sep{width:.22rem;border-radius:1rem;background:var(--line);margin:0 .3rem}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;font-size:1.8rem;color:#1E2B4D}
.flakes{animation:fall 8s linear infinite}
.flakesB{animation:fall 12s linear infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(900px)}}
@media (prefers-reduced-motion: reduce){.drift,.flakes,.flakesB{animation:none}.say,.chip,.act{transition:none}}
@media (max-width:760px){
  html{font-size:12px}
  .home.on{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;padding:1.4rem;overflow:auto}
  .hero-art{max-height:30vh}
  .acts{grid-template-columns:1fr}
  .mid,.mid.three{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}
  .side{flex-direction:row;overflow-x:auto;justify-content:flex-start}
  .side .chip{width:auto}
  .keys{display:none}
}
</style>
</head>
<body>
<div id="app">

<section id="home" class="home on" aria-label="처음 화면">
  <div class="hero-text">
    <span class="tag">상상 &nbsp;함께 골라요 7</span>
    <h1><span class="w">여</span><span class="w">기</span><span class="w">저</span><span class="w">기</span>에서<br>본다면</h1>
    <p class="goal">보는 위치가 달라지면, 배경이 달라지면<br>같은 것도 다르게 보여요.</p>
  </div>
  <svg class="hero-art" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="heroArt"></g></svg>
  <nav class="acts" aria-label="활동 고르기">
    <button class="act a1" data-go="act1"><svg viewBox="0 0 100 100" id="ic1"></svg><b><span class="n">1</span>하늘에서 보면?</b><small>우산 쓴 친구들을 사람, 새, 개미의 눈으로 봐요</small></button>
    <button class="act a2" data-go="act2"><svg viewBox="0 0 100 100" id="ic2"></svg><b><span class="n">2</span>어디에서 봤을까?</b><small>교실 물건을 위, 앞, 옆, 아래에서 보고 맞혀요</small></button>
    <button class="act a3" data-go="act3"><svg viewBox="-250 -520 500 540" id="ic3"></svg><b><span class="n">3</span>어디에서 하는 걸까?</b><small>같은 자세도 배경이 바뀌면 다른 행동이 돼요</small></button>
  </nav>
  <div class="keys"><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>활동 고르기</span><span><kbd>←</kbd><kbd>→</kbd>보기 바꾸기</span><span><kbd>↑</kbd><kbd>↓</kbd>물건, 자세 바꾸기</span><span><kbd>Space</kbd>예시 말, 정답</span><span><kbd>Enter</kbd>문제 내기</span><span><kbd>Esc</kbd>처음으로</span><span><kbd>F</kbd>크게 보기</span></div>
</section>

<section id="act1" class="screen" aria-label="하늘에서 보면">
  <header class="bar"><button class="pill" data-go="home">⌂ 처음으로</button><p class="q"><i>?</i><span>비 오는 날, 하늘을 나는 새의 눈에는 어떻게 보일까요?</span></p><button class="pill fs">⛶ 크게 보기</button></header>
  <div class="stage" id="st1"><div class="badge" id="b1"></div><div class="hint">화면을 끌어서 돌려 보세요</div><div class="say off" id="say1"></div></div>
  <footer class="ctrl" id="c1"></footer>
</section>

<section id="act2" class="screen" aria-label="어디에서 봤을까">
  <header class="bar"><button class="pill" data-go="home">⌂ 처음으로</button><p class="q"><i>?</i><span id="q2"></span></p><button class="pill fs">⛶ 크게 보기</button></header>
  <div class="mid"><div class="side" id="s2"></div>
    <div class="stage" id="st2"><div class="badge" id="b2"></div><div class="hint" id="h2">화면을 끌어서 돌려 보세요</div><div class="say off" id="say2"></div></div></div>
  <footer class="ctrl" id="c2"></footer>
</section>

<section id="act3" class="screen" aria-label="어디에서 하는 걸까">
  <header class="bar"><button class="pill" data-go="home">⌂ 처음으로</button><p class="q"><i>?</i><span id="q3"></span></p><button class="pill fs">⛶ 크게 보기</button></header>
  <div class="mid three"><div class="side" id="s3"></div>
    <div class="stage" id="st3" style="background:#f4f7fb">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" id="scene3" aria-hidden="true"><g id="bgs"></g><g transform="translate(800 800)"><g id="kid"></g></g></svg>
      <div class="badge" id="b3"></div><div class="say off" id="say3"></div></div><div class="side" id="r3"></div></div>
  <footer class="ctrl" id="c3"></footer>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/OutlineEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const PI=Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT_READY=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('80px Jua').catch(()=>{}),new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
function seeded(n){let s=n;return ()=>(s=(s*9301+49297)%233280)/233280;}
const INK='#1F2640';
const f1=v=>(+v).toFixed(1);

/* =========================================================
   SVG 공용 도우미
   ========================================================= */
function lg(id,stops,x2=0,y2=1){return `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!==undefined?` stop-opacity="${a}"`:''}/>`).join('')}</linearGradient>`;}
function rg(id,cx,cy,r,stops){return `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}" gradientUnits="userSpaceOnUse">${stops.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!==undefined?` stop-opacity="${a}"`:''}/>`).join('')}</radialGradient>`;}
function cloudS(x,y,s,op=1){return `<g transform="translate(${x} ${y}) scale(${s})" opacity="${op}"><ellipse cx="4" cy="22" rx="122" ry="40" fill="#D6E7F6"/><g fill="#fff"><ellipse cx="-60" cy="6" rx="60" ry="38"/><ellipse cx="4" cy="-22" rx="64" ry="52"/><ellipse cx="68" cy="2" rx="56" ry="38"/><ellipse cx="0" cy="10" rx="104" ry="32"/></g><ellipse cx="-14" cy="-38" rx="26" ry="12" fill="#fff" opacity=".9"/></g>`;}
function treeR(x,y,s,c1,c2){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12,0 L-8,-90 L8,-90 L12,0Z" fill="#8A5A3B" stroke="#5E3B24" stroke-width="4"/><g stroke="rgba(31,38,64,.25)" stroke-width="4"><circle cx="-40" cy="-110" r="52" fill="${c1}"/><circle cx="42" cy="-116" r="50" fill="${c1}"/><circle cx="0" cy="-160" r="62" fill="${c1}"/></g><circle cx="-18" cy="-178" r="22" fill="${c2}" opacity=".7"/><circle cx="-52" cy="-122" r="16" fill="${c2}" opacity=".6"/></g>`;}
function pineS(x,y,s){let o=`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-13" y="-36" width="26" height="40" fill="#7A5236" stroke="#4E3322" stroke-width="4"/>`;
  [[-30,170],[-110,136],[-180,100]].forEach(([yy,w])=>{o+=`<path d="M${-w/2},${yy} L0,${yy-112} L${w/2},${yy}Z" fill="#2F6E4F" stroke="#1F4D37" stroke-width="4" stroke-linejoin="round"/><path d="M${-w/2+4},${yy-2} Q${-w/4},${yy-16} 0,${yy-6} Q${w/4},${yy-18} ${w/2-4},${yy-2}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M${-w/5},${yy-72} L0,${yy-112} L${w/5},${yy-72} Q0,${yy-62} ${-w/5},${yy-72}Z" fill="#fff"/>`;});return o+'</g>';}
function birdV(x,y,s,c='#1E2B4D'){return `<path transform="translate(${x} ${y}) scale(${s})" d="M0,0 q22,-22 44,0 q22,-22 44,0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}

/* ---------- 위에서 본 우산 ---------- */
let umbN=0;
function umbTop(cx,cy,r,c1,c2,rot=0,opt={}){
  const n=8,id='ug'+(umbN++);let s='';
  if(opt.shadow!==false)s+=`<circle cx="${cx+r*.08}" cy="${cy+r*.1}" r="${r*.98}" fill="rgba(30,43,77,.18)"/>`;
  if(opt.boots)s+=`<rect x="${cx-r*.2}" y="${cy+r*.84}" width="${r*.16}" height="${r*.24}" rx="${r*.07}" fill="${opt.boots}" stroke="${INK}" stroke-width="2.5"/><rect x="${cx+r*.04}" y="${cy+r*.86}" width="${r*.16}" height="${r*.24}" rx="${r*.07}" fill="${opt.boots}" stroke="${INK}" stroke-width="2.5"/>`;
  s+=`<defs>${rg(id,cx-r*.25,cy-r*.3,r*1.25,[[0,'#fff',.5],[.55,'#fff',.08],[1,'#000',.12]])}</defs><g transform="rotate(${rot} ${cx} ${cy})">`;
  let outline='';
  for(let i=0;i<n;i++){
    const a0=i/n*2*PI,a1=(i+1)/n*2*PI,am=(a0+a1)/2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const qx=cx+r*.84*Math.cos(am),qy=cy+r*.84*Math.sin(am);
    let col=opt.rings?c1:(i%2?c2:c1);
    const d=`M${cx},${cy} L${f1(x0)},${f1(y0)} Q${f1(qx)},${f1(qy)} ${f1(x1)},${f1(y1)}Z`;
    s+=`<path d="${d}" fill="${col}"/>`;
    if(opt.rings){for(const k of [.72,.44]){const rr=r*k;const qx2=cx+rr*.86*Math.cos(am),qy2=cy+rr*.86*Math.sin(am);
      s+=`<path d="M${f1(cx+rr*Math.cos(a0))},${f1(cy+rr*Math.sin(a0))} Q${f1(qx2)},${f1(qy2)} ${f1(cx+rr*Math.cos(a1))},${f1(cy+rr*Math.sin(a1))}" stroke="${c2}" stroke-width="${f1(r*.1)}" fill="none"/>`;}}
    outline+=(i?'':`M${f1(x0)},${f1(y0)}`)+` Q${f1(qx)},${f1(qy)} ${f1(x1)},${f1(y1)}`;
    s+=`<line x1="${cx}" y1="${cy}" x2="${f1(x0)}" y2="${f1(y0)}" stroke="rgba(0,0,0,.18)" stroke-width="2"/>`;
  }
  s+=`<path d="${outline}Z" fill="url(#${id})" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
  for(let i=0;i<n;i++){const a=i/n*2*PI;s+=`<circle cx="${f1(cx+r*Math.cos(a))}" cy="${f1(cy+r*Math.sin(a))}" r="${f1(r*.035+1)}" fill="${INK}"/>`;}
  if(opt.frog){s+=`<g stroke="${INK}" stroke-width="3">`;for(const sx of [-1,1]){const ex=cx+sx*r*.3,ey=cy+r*.36;s+=`<circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(r*.17)}" fill="#fff"/><circle cx="${f1(ex)}" cy="${f1(ey+r*.03)}" r="${f1(r*.08)}" fill="${INK}"/>`;}s+='</g>';}
  return s+`<circle cx="${cx}" cy="${cy}" r="${f1(r*.07)}" fill="#fff" stroke="${INK}" stroke-width="3"/></g>`;
}

/* ---------- 아이 캐릭터 ---------- */
const KID={skin:'#F8CBA6',blush:'#FF8FA3',hair:'#2B1D16',hairHi:'#5A4033',shirt:'#20242F',stripe:'#FFFFFF',pants:'#DCC9A3',pantsSh:'#BFA97F'};
function limb(x,y,a,L,s){const r=a*PI/180;return [x+s*Math.sin(r)*L,y+Math.cos(r)*L];}
function kidSVG(p,uid){
  const TH=100,SH=98,UA=82,FA=80,leg={};
  for(const s of [-1,1]){
    const t=s<0?p.lt:p.rt, sh=s<0?p.ls:p.rs, h=[s*30,0];
    const k=limb(h[0],h[1],t,TH,s), f=limb(k[0],k[1],sh,SH,s);
    leg[s]={h,k,f};
  }
  const off=-Math.max(leg[-1].f[1],leg[1].f[1])-18;
  const P=a=>f1(a[0])+','+f1(a[1]);
  const torso='M-56,-172 Q-74,-168 -72,-146 L-64,8 Q0,18 64,8 L72,-146 Q74,-168 56,-172 Z';
  const spread=Math.abs(leg[1].f[0]);
  let o=`<ellipse cx="0" cy="4" rx="${f1(140+spread*.5)}" ry="20" fill="rgba(30,43,77,.2)"/>`;
  o+=`<g transform="translate(0 ${f1(off)})" stroke-linejoin="round" stroke-linecap="round">`;
  // 다리

  crouch:{stage:'무대에서 개구리 춤을 춰요.',soccer:'공이 오기를 기다리며 준비해요.',room:'바닥에 앉아 신발을 신어요.',sky:'언덕에 핀 꽃을 가까이 살펴봐요.',beach:'모래사장에서 조개를 주워요.',snow:'눈을 뭉쳐서 눈덩이를 만들어요.',race:'출발선에서 "준비!" 자세를 해요.'},
};
const A3={pose:0,bg:0,say:false,cur:null,inited:false};
function initA3(){
  $('#bgs').innerHTML=BGS.map((b,i)=>`<g class="bgl" style="opacity:${i?0:1};transition:opacity .45s">${b.svg()}</g>`).join('');
  A3.layers=[...document.querySelectorAll('#bgs .bgl')];
  const s=$('#s3');
  A3.poseBtns=POSES.map((p,i)=>{const b=chip(`<svg viewBox="-250 -520 500 540">${kidSVG(p.a,'p'+i)}</svg>${p.n}`,'pose',()=>setPose(i));s.appendChild(b);return b;});
  const r=$('#r3'),c=$('#c3');
  A3.bgBtns=BGS.map((b,i)=>{const x=chip(`<span class="e">${b.e}</span>${b.n}`,'',()=>setBg(i));r.appendChild(x);return x;});
  A3.sayBtn=chip('','big accent',()=>{A3.say=!A3.say;renderA3();});c.appendChild(A3.sayBtn);
  A3.cur=Object.assign({},POSES[0].a);$('#kid').innerHTML=kidSVG(A3.cur,'k');
  A3.inited=true;renderA3();
}
function setPose(i){
  const from=Object.assign({},A3.cur),to=POSES[i].a;A3.pose=i;renderA3();
  cancelAnimationFrame(A3.raf);const t0=performance.now(),D=REDUCED?1:420;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);
    for(const key in to)A3.cur[key]=from[key]+(to[key]-from[key])*e;$('#kid').innerHTML=kidSVG(A3.cur,'k');
    if(k<1)A3.raf=requestAnimationFrame(step);};A3.raf=requestAnimationFrame(step);}
function setBg(i){A3.bg=i;A3.layers.forEach((l,j)=>l.style.opacity=j===i?1:0);renderA3();}
function renderA3(){
  const p=POSES[A3.pose],b=BGS[A3.bg];
  A3.poseBtns.forEach((x,i)=>x.classList.toggle('on',i===A3.pose));
  A3.bgBtns.forEach((x,i)=>x.classList.toggle('on',i===A3.bg));
  $('#q3').textContent=p.q;
  $('#b3').textContent=b.k==='none'?'◻️ 배경이 없어요':`${b.e} ${b.n}`;
  A3.sayBtn.innerHTML=`<span class="e">💬</span>예시 말 ${A3.say?'숨기기':'보기'}`;A3.sayBtn.classList.toggle('on',A3.say);
  const t=b.k==='none'?SAY3.none:SAY3[p.k][b.k];
  setSay($('#say3'),A3.say,`<small>${b.k==='none'?'생각해 봐요':'예를 들면'}</small>${t}`);
}

/* =========================================================
   화면 이동, 키보드
   ========================================================= */
let cur='home';
function go(id){
  cur=id;document.querySelectorAll('.home,.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  if(id==='act1'){if(!A1.inited)initA1();A1.v&&A1.v.start();}else A1.v&&A1.v.stop();
  if(id==='act2'){if(!A2.inited)initA2();A2.v&&A2.v.start();}else A2.v&&A2.v.stop();
  if(id==='act3'&&!A3.inited)initA3();
  requestAnimationFrame(()=>{A1.v&&A1.v.resize();A2.v&&A2.v.resize();});
}
document.addEventListener('pointerup',()=>{const a=document.activeElement;if(a&&a.tagName==='BUTTON')setTimeout(()=>a.blur(),0);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);
  if(e.target.closest('.fs'))fullscreen();});
function fullscreen(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(err){}}
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;const k=e.key;
  if(k==='1'||k==='2'||k==='3'){go('act'+k);return;}
  if(k==='Escape'||k==='Home'){go('home');return;}
  if(k==='f'||k==='F'){fullscreen();return;}
  const cyc=(i,n,d)=>((i<0?0:i)+d+n)%n;
  if(cur==='act1'&&A1.inited){
    if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();setA1(cyc(A1.idx,3,k==='ArrowRight'?1:-1));}
    else if(k===' '){e.preventDefault();toggleA1Say();}
  }else if(cur==='act2'&&A2.inited){
    if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();A2.mode='explore';setView2(cyc(A2.view,4,k==='ArrowRight'?1:-1));}
    else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();A2.mode='explore';setObj(cyc(A2.obj,OBJS.length,k==='ArrowDown'?1:-1));}
    else if(k===' '){e.preventDefault();sayOrAnswer();}
    else if(k==='Enter'){e.preventDefault();quiz();}
  }else if(cur==='act3'&&A3.inited){
    if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();setBg(cyc(A3.bg,BGS.length,k==='ArrowRight'?1:-1));}
    else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();setPose(cyc(A3.pose,POSES.length,k==='ArrowDown'?1:-1));}
    else if(k===' '){e.preventDefault();A3.say=!A3.say;renderA3();}
  }
});
})();
</script>
